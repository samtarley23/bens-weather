<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ben's Weather</title>
  <meta name="description" content="Where Ben is and how the weather feels — sunny, chilly, all wet, or just right." />
  <meta name="theme-color" content="#4a90d9" />
  <link rel="canonical" href="https://samtarley23.github.io/bens-weather/" />
  <link rel="apple-touch-icon" href="https://samtarley23.github.io/bens-weather/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ben's Weather" />
  <meta property="og:url" content="https://samtarley23.github.io/bens-weather/" />
  <meta property="og:title" content="Ben's Weather" />
  <meta property="og:description" content="Where Ben is and how the weather feels — sunny, chilly, all wet, or just right." />
  <meta property="og:image" content="https://samtarley23.github.io/bens-weather/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Ben's Weather — crayon sun, cloud, and thermometer" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ben's Weather" />
  <meta name="twitter:description" content="Where Ben is and how the weather feels — sunny, chilly, all wet, or just right." />
  <meta name="twitter:image" content="https://samtarley23.github.io/bens-weather/og-image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #fff8e7;
      --ink: #2b1d12;
      --crayon-red: #e85d4c;
      --crayon-blue: #4a90d9;
      --crayon-yellow: #f5d76e;
      --crayon-green: #6cbc5a;
      --crayon-purple: #9b6bc9;
      --crayon-orange: #f0a04b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Fredoka", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, #ffe8a3 0 18%, transparent 19%),
        radial-gradient(circle at 88% 12%, #c9e7ff 0 14%, transparent 15%),
        radial-gradient(circle at 80% 78%, #ffd0c8 0 16%, transparent 17%),
        radial-gradient(circle at 18% 82%, #d8f5c8 0 12%, transparent 13%),
        repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(43,29,18,.04) 27px, rgba(43,29,18,.04) 28px),
        var(--paper);
      overflow-x: hidden;
    }
    .scribble { position: fixed; pointer-events: none; opacity: .18; font-family: "Caveat", cursive; font-size: 3rem; z-index: 0; }
    .scribble.a { top: 6%; left: 4%; color: var(--crayon-red); transform: rotate(-8deg); }
    .scribble.b { top: 14%; right: 6%; color: var(--crayon-blue); transform: rotate(12deg); }
    .scribble.c { bottom: 10%; left: 8%; color: var(--crayon-green); transform: rotate(6deg); }
    .scribble.d { bottom: 16%; right: 5%; color: var(--crayon-purple); transform: rotate(-14deg); }
    main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem 2.5rem; }
    h1 {
      font-family: "Caveat", cursive;
      font-size: clamp(2.6rem, 9vw, 3.6rem);
      margin: 0 0 1rem;
      text-align: center;
      color: var(--crayon-blue);
      text-shadow: 2px 2px 0 #fff, 3px 3px 0 rgba(74,144,217,.35);
      line-height: .95;
    }
    .card {
      background: #fffdf8;
      border: 4px solid var(--ink);
      border-radius: 28px 22px 30px 18px / 22px 30px 18px 28px;
      padding: 1.15rem 1.1rem 1.35rem;
      box-shadow: 6px 8px 0 rgba(43,29,18,.12), inset 0 0 0 3px rgba(245,215,110,.35);
      position: relative;
      margin-bottom: 1rem;
    }
    .card::before {
      content: "";
      position: absolute;
      top: -10px; left: 28px;
      width: 54px; height: 18px;
      background: var(--crayon-yellow);
      border: 3px solid var(--ink);
      border-radius: 4px;
      transform: rotate(-4deg);
    }
    .where-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .3rem .7rem; border: 3px solid var(--ink); border-radius: 999px;
      font-weight: 600; font-size: .92rem; background: #fff;
    }
    .badge.home { background: #ffe9b8; }
    .badge.work { background: #cfe8ff; }
    .clock { font-size: .88rem; opacity: .75; }
    .mood { text-align: center; margin: .25rem 0 .9rem; }
    .mood-emoji {
      font-size: 4.6rem; line-height: 1;
      filter: drop-shadow(3px 4px 0 rgba(43,29,18,.15));
      animation: wobble 2.8s ease-in-out infinite;
    }
    @keyframes wobble {
      0%,100% { transform: rotate(-3deg) scale(1); }
      50% { transform: rotate(4deg) scale(1.04); }
    }
    .mood-line {
      font-family: "Caveat", cursive;
      font-size: clamp(1.7rem, 5.5vw, 2.25rem);
      margin: .35rem 0 0;
      color: var(--crayon-red);
      line-height: 1.1;
    }
    .summary {
      margin: 0 0 1rem;
      padding: .75rem .85rem;
      border: 3px dashed var(--ink);
      border-radius: 16px;
      background: rgba(255,255,255,.75);
      font-size: .98rem;
      line-height: 1.4;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .55rem;
    }
    @media (min-width: 520px) {
      .stats { grid-template-columns: repeat(3, 1fr); }
    }
    .stat {
      border: 3px dashed var(--ink);
      border-radius: 16px;
      padding: .65rem .55rem;
      background: rgba(255,255,255,.7);
      text-align: center;
    }
    .stat .label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      opacity: .65;
      margin-bottom: .15rem;
    }
    .stat .value { font-size: 1.15rem; font-weight: 700; }
    .stat .sub { font-size: .78rem; opacity: .7; margin-top: .15rem; }
    .section-title {
      font-family: "Caveat", cursive;
      font-size: 1.55rem;
      margin: 0 0 .55rem;
      color: var(--crayon-purple);
    }
    .forecast {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: .35rem;
      overflow-x: auto;
    }
    .day {
      min-width: 0;
      border: 3px solid var(--ink);
      border-radius: 14px;
      padding: .45rem .25rem .55rem;
      text-align: center;
      background: #fff;
    }
    .day .dname { font-size: .72rem; font-weight: 700; margin-bottom: .15rem; }
    .day .icon { font-size: 1.4rem; line-height: 1.2; }
    .day .hi { font-size: .85rem; font-weight: 700; color: var(--crayon-red); }
    .day .lo { font-size: .8rem; opacity: .75; }
    .day .wx { font-size: .65rem; line-height: 1.2; margin-top: .2rem; opacity: .8; }
    .error { color: var(--crayon-red); text-align: center; font-weight: 600; margin: .5rem 0 0; }
    .loading .mood-line { color: var(--crayon-orange); }
  </style>
</head>
<body>
  <div class="scribble a" aria-hidden="true">☆</div>
  <div class="scribble b" aria-hidden="true">☁︎</div>
  <div class="scribble c" aria-hidden="true">☂︎</div>
  <div class="scribble d" aria-hidden="true">☀︎</div>
  <main>
    <h1>Ben's Weather</h1>
    <section class="card" id="app" aria-live="polite">
      <div class="where-row">
        <span class="badge" id="placeBadge">…</span>
        <span class="clock" id="clock"></span>
      </div>
      <div class="mood loading" id="mood">
        <div class="mood-emoji" id="emoji">⏳</div>
        <p class="mood-line" id="moodLine">…</p>
      </div>
      <p class="summary" id="summary">…</p>
      <div class="stats" id="stats"></div>
      <p class="error" id="error" hidden></p>
    </section>
    <section class="card">
      <h2 class="section-title">This week</h2>
      <div class="forecast" id="forecast"></div>
    </section>
  </main>
  <script>
    const PLACES = {
      home: { short: "🏠 Home", badgeClass: "home", lat: 42.2834, lon: -71.2328, label: "Needham" },
      work: { short: "🏢 Work", badgeClass: "work", lat: 42.3512, lon: -71.0440, label: "Boston" }
    };

    const WMO = {
      0: ["Sunny", "☀️"],
      1: ["Mostly sunny", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Cloudy", "☁️"],
      45: ["Foggy", "🌫️"],
      48: ["Icy fog", "🌫️"],
      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Heavy drizzle", "🌧️"],
      61: ["Light rain", "🌧️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],
      66: ["Freezing rain", "🧊"],
      67: ["Heavy freezing rain", "🧊"],
      71: ["Light snow", "🌨️"],
      73: ["Snow", "❄️"],
      75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "🌨️"],
      80: ["Showers", "🌦️"],
      81: ["Heavy showers", "🌧️"],
      82: ["Downpours", "🌧️"],
      85: ["Snow showers", "🌨️"],
      86: ["Heavy snow showers", "❄️"],
      95: ["Thunderstorm", "⛈️"],
      96: ["Thunder + hail", "⛈️"],
      99: ["Severe storm", "⛈️"]
    };

    function bostonNow() {
      return new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
    }

    function pickPlace(now) {
      const day = now.getDay();
      const hour = now.getHours();
      const weekday = day >= 1 && day <= 5;
      const workHours = hour >= 9 && hour < 18;
      return weekday && workHours ? PLACES.work : PLACES.home;
    }

    function formatClock(now) {
      return now.toLocaleString("en-US", {
        weekday: "short", month: "short", day: "numeric",
        hour: "numeric", minute: "2-digit", timeZone: "America/New_York"
      }) + " ET";
    }

    function wx(code) {
      return WMO[code] || ["Weird sky", "❓"];
    }

    function isWet(code, precipProb) {
      return ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code === 95 || code === 96 || code === 99) || precipProb >= 55;
    }
    function isSnowy(code) {
      return (code >= 71 && code <= 77) || code === 85 || code === 86;
    }

    function moodFor({ tempF, feelsF, code, precipProb }) {
      const wet = isWet(code, precipProb);
      if (isSnowy(code)) return { emoji: "☃️", line: "Ben is feeling like a snowman!" };
      if (wet && feelsF <= 45) return { emoji: "🥶", line: "Ben is feeling chilly AND all wet!" };
      if (wet) return { emoji: "🌧️", line: "Ben is feeling all wet." };
      if (feelsF >= 85 || tempF >= 88) return { emoji: "🥵", line: "Ben is feeling too hot." };
      if (feelsF <= 35 || tempF <= 32) return { emoji: "🧊", line: "Ben is feeling chilly." };
      if (feelsF <= 48) return { emoji: "🧥", line: "Ben is feeling a little chilly." };
      if (tempF >= 75) return { emoji: "😎", line: "Ben is feeling toasty-warm." };
      if (code === 0 || code === 1) return { emoji: "🌞", line: "Ben is feeling just right!" };
      return { emoji: "😊", line: "Ben is feeling pretty okay." };
    }

    function windWord(mph) {
      if (mph < 1) return "Calm";
      if (mph < 4) return "Light air";
      if (mph < 8) return "Light breeze";
      if (mph < 13) return "Gentle breeze";
      if (mph < 19) return "Moderate breeze";
      if (mph < 25) return "Fresh breeze";
      if (mph < 32) return "Strong breeze";
      return "Windy";
    }

    function compass(deg) {
      if (deg == null || Number.isNaN(deg)) return "—";
      const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
      return dirs[Math.round(deg / 22.5) % 16];
    }

    function band(temp) {
      if (temp >= 85) return "hot";
      if (temp >= 75) return "warm";
      if (temp >= 60) return "mild";
      if (temp >= 45) return "cool";
      if (temp >= 32) return "chilly";
      return "freezing";
    }

    function buildSummary({ place, now, code, tempF, feelsF, windMph, windDir, precipProb, todayHi, todayLo, tomorrowHi, tomorrowCode }) {
      const [sky] = wx(code);
      const dayName = now.toLocaleString("en-US", { weekday: "long", timeZone: "America/New_York" });
      const [tomSky] = wx(tomorrowCode);
      const windBit = windMph >= 15
        ? `${compass(windDir)} winds around ${Math.round(windMph)} mph`
        : windMph >= 5
          ? `a ${windWord(windMph).toLowerCase()} from the ${compass(windDir)}`
          : "mostly light winds";
      const precipBit = precipProb >= 55
        ? `Rain chances look decent (~${precipProb}%).`
        : precipProb >= 30
          ? `A small chance of wet stuff (~${precipProb}%).`
          : "Staying mostly dry.";
      return `${dayName} in ${place.label}: ${sky.toLowerCase()}, ${tempF}°F (feels ${feelsF}°F), ${windBit}. Today’s range about ${todayLo}°–${todayHi}°F. ${precipBit} Tomorrow looks ${tomSky.toLowerCase()} with a high near ${tomorrowHi}°F.`;
    }

    async function fetchWeather(place) {
      const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}` +
        `&current=temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,precipitation,precipitation_probability,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max` +
        `&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FNew_York&forecast_days=7`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Weather unavailable (" + res.status + ")");
      return res.json();
    }

    function setText(id, text) {
      document.getElementById(id).textContent = text;
    }

    function stat(label, value, sub) {
      return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
    }

    async function refresh() {
      const err = document.getElementById("error");
      err.hidden = true;
      const now = bostonNow();
      const place = pickPlace(now);
      const badge = document.getElementById("placeBadge");
      badge.textContent = place.short;
      badge.className = "badge " + place.badgeClass;
      setText("clock", formatClock(now));
      document.getElementById("mood").classList.add("loading");
      setText("moodLine", "…");
      document.getElementById("emoji").textContent = "⏳";

      try {
        const data = await fetchWeather(place);
        const c = data.current;
        const d = data.daily;
        const tempF = Math.round(c.temperature_2m);
        const feelsF = Math.round(c.apparent_temperature);
        const code = c.weather_code;
        const precipProb = c.precipitation_probability ?? d.precipitation_probability_max?.[0] ?? 0;
        const precip = c.precipitation ?? 0;
        const humidity = Math.round(c.relative_humidity_2m);
        const dew = Math.round(c.dew_point_2m);
        const pressure = (c.pressure_msl / 33.8639).toFixed(2); // hPa → inHg
        const windMph = c.wind_speed_10m;
        const gust = c.wind_gusts_10m;
        const windDir = c.wind_direction_10m;
        const clouds = Math.round(c.cloud_cover);
        const [skyLabel, skyEmoji] = wx(code);
        const todayHi = Math.round(d.temperature_2m_max[0]);
        const todayLo = Math.round(d.temperature_2m_min[0]);
        const todayRain = (d.precipitation_sum[0] ?? 0).toFixed(2);
        const tomorrowHi = Math.round(d.temperature_2m_max[1]);
        const tomorrowCode = d.weather_code[1];
        const mood = moodFor({ tempF, feelsF, code, precipProb });

        document.getElementById("mood").classList.remove("loading");
        document.getElementById("emoji").textContent = mood.emoji;
        setText("moodLine", mood.line);
        setText("summary", buildSummary({
          place, now, code, tempF, feelsF, windMph, windDir, precipProb,
          todayHi, todayLo, tomorrowHi, tomorrowCode
        }));

        document.getElementById("stats").innerHTML = [
          stat("Temperature", tempF + "°F", band(tempF)),
          stat("Feels like", feelsF + "°F", ""),
          stat("Sky", skyEmoji + " " + skyLabel, clouds + "% clouds"),
          stat("Today", todayHi + "° / " + todayLo + "°", "high / low"),
          stat("Wind", compass(windDir) + " " + Math.round(windMph), "gust " + Math.round(gust) + " · " + windWord(windMph)),
          stat("Humidity", humidity + "%", "dew " + dew + "°F"),
          stat("Pressure", pressure + " in", ""),
          stat("Rain chance", precipProb + "%", "today " + todayRain + '"'),
          stat("Precip now", precip.toFixed(2) + '"', "")
        ].join("");

        const forecast = document.getElementById("forecast");
        forecast.innerHTML = d.time.map((iso, i) => {
          const dt = new Date(iso + "T12:00:00");
          const name = i === 0 ? "Today" : dt.toLocaleString("en-US", { weekday: "short", timeZone: "America/New_York" });
          const [label, icon] = wx(d.weather_code[i]);
          const hi = Math.round(d.temperature_2m_max[i]);
          const lo = Math.round(d.temperature_2m_min[i]);
          return `<div class="day"><div class="dname">${name}</div><div class="icon">${icon}</div><div class="hi">${hi}°</div><div class="lo">${lo}°</div><div class="wx">${label}</div></div>`;
        }).join("");
      } catch (e) {
        err.hidden = false;
        err.textContent = e.message || "Couldn’t load weather.";
        setText("moodLine", "Ben is feeling confused.");
        document.getElementById("emoji").textContent = "😵";
      }
    }

    refresh();
    setInterval(refresh, 60 * 1000);
  </script>
</body>
</html>
